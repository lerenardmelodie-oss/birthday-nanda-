  <script>
    // const wishButton = document.getElementById("wishButton");
const wishText = document.getElementById("wishText");

const flame = document.querySelector(".extra-flame");
const candleGlow = document.querySelector(".candle-glow");

const birthdayMessage =
  document.getElementById("birthdayMessage");


  function createConfetti(x, y, amount = 18) {

    const symbols = [
        "♡",
            "✦",
                "✧",
                    "★",
                        "✨"
                          ];

                            const colors = [
                                "#ff7eae",
                                    "#c79aff",
                                        "#ffd45c",
                                            "#ffffff",
                                                "#ff9fc6"
                                                  ];

                                                    for (let i = 0; i < amount; i++) {

                                                        const p = document.createElement("div");

                                                            p.className = "wish-particle";

                                                                p.innerHTML =
                                                                      symbols[
                                                                              Math.floor(
                                                                                        Math.random() * symbols.length
                                                                                                )
                                                                                                      ];

                                                                                                          p.style.left = x + "px";
                                                                                                              p.style.top = y + "px";

                                                                                                                  p.style.color =
                                                                                                                        colors[
                                                                                                                                Math.floor(
                                                                                                                                          Math.random() * colors.length
                                                                                                                                                  )
                                                                                                                                                        ];

                                                                                                                                                            p.style.fontSize =
                                                                                                                                                                  (16 + Math.random() * 18) + "px";


                                                                                                                                                                      const angle =
                                                                                                                                                                            Math.random() *
                                                                                                                                                                                  Math.PI *
                                                                                                                                                                                        2;

                                                                                                                                                                                            const distance =
                                                                                                                                                                                                  100 +
                                                                                                                                                                                                        Math.random() * 280;

                                                                                                                                                                                                            const dx =
                                                                                                                                                                                                                  Math.cos(angle) *
                                                                                                                                                                                                                        distance;

                                                                                                                                                                                                                            const dy =
                                                                                                                                                                                                                                  Math.sin(angle) *
                                                                                                                                                                                                                                        distance;


                                                                                                                                                                                                                                            p.animate(

                                                                                                                                                                                                                                                  [
                                                                                                                                                                                                                                                          {
                                                                                                                                                                                                                                                                    transform:
                                                                                                                                                                                                                                                                                "translate(-50%,-50%) scale(0)",
                                                                                                                                                                                                                                                                                          opacity: 1
                                                                                                                                                                                                                                                                                                  },

                                                                                                                                                                                                                                                                                                          {
                                                                                                                                                                                                                                                                                                                    transform:
                                                                                                                                                                                                                                                                                                                                `translate(
                                                                                                                                                                                                                                                                                                                                              calc(-50% + ${dx}px),
                                                                                                                                                                                                                                                                                                                                                            calc(-50% + ${dy}px)
                                                                                                                                                                                                                                                                                                                                                                        )
                                                                                                                                                                                                                                                                                                                                                                                    scale(1.5)
                                                                                                                                                                                                                                                                                                                                                                                                rotate(${Math.random() * 360}deg)`,

                                                                                                                                                                                                                                                                                                                                                                                                          opacity: 0
                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                        ],

                                                                                                                                                                                                                                                                                                                                                                                                                              {
                                                                                                                                                                                                                                                                                                                                                                                                                                      duration:
                                                                                                                                                                                                                                                                                                                                                                                                                                                1200 +
                                                                                                                                                                                                                                                                                                                                                                                                                                                          Math.random() * 900,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  easing:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "cubic-bezier(.2,.8,.3,1)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.body.appendChild(p);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p.remove();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }, 2200);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          wishButton.addEventListener("click", () => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                wishButton.classList.contains("blowing")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          wishButton.classList.add("blowing");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            wishText.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "✨ Making a wish... ✨";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Effet de vent
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    for (let i = 0; i < 3; i++) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const wind =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  wind.className = "wind";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      wind.style.top =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            (40 + i * 5) + "%";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                wind.style.animationDelay =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      (i * .12) + "s";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.body.appendChild(wind);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    wind.remove();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // La flamme s'éteint
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              setTimeout(() => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  flame.classList.add("blowing");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      candleGlow.classList.add("blowing");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }, 250);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Message + confettis
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            setTimeout(() => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                createConfetti(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      innerWidth / 2,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            innerHeight / 2,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  55
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          birthdayMessage.classList.add("show");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              wishText.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "🎉 Happy Birthday! 🎉";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }, 900);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Réinitialisation
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          setTimeout(() => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              birthdayMessage.classList.remove("show");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  flame.classList.remove("blowing");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      candleGlow.classList.remove("blowing");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          flame.style.animation = "none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              candleGlow.style.animation = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  void flame.offsetWidth;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      flame.style.animation =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "flameFlicker .18s infinite alternate";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                candleGlow.style.animation =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "candleLight .8s ease-in-out infinite alternate";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          wishButton.classList.remove("blowing");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              wishText.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Make a wish! ✨";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }, 5500);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
  </script>
